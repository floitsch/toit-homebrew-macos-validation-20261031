name: Check style of experimental Make formula

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Homebrew on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      LOG_DIR: ${{ github.workspace }}/validation-logs
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Remove unrelated Azure CLI migration on Intel runner
        if: matrix.runner == 'macos-15-intel'
        run: |
          if brew list --formula azure-cli >/dev/null 2>&1; then
            brew uninstall --force --ignore-dependencies azure-cli
          fi

      - name: Update Homebrew
        timeout-minutes: 10
        run: |
          mkdir -p "$LOG_DIR"
          brew update 2>&1 | tee "$LOG_DIR/update.log"

      - name: Prepare Homebrew core and formula
        timeout-minutes: 10
        run: |
          brew tap --force homebrew/core 2>&1 | tee "$LOG_DIR/tap.log"
          core=$(brew --repository homebrew/core)
          # Remove preinstalled runner edits and update/stash conflicts.
          git -C "$core" status --short | tee "$LOG_DIR/runner-edits.log"
          git -C "$core" restore --source=HEAD --staged --worktree .
          cp Formula/toit.rb "$core/Formula/t/toit.rb"
          git -C "$core" add Formula/t/toit.rb
          {
            sw_vers
            uname -m
            brew config
            git -C "$core" rev-parse HEAD
            shasum -a 256 Formula/toit.rb
          } 2>&1 | tee "$LOG_DIR/environment.log"

      - name: Check formula style
        run: brew style --formula toit 2>&1 | tee "$LOG_DIR/style.log"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: homebrew-${{ matrix.runner }}
          path: validation-logs/
          retention-days: 7
