name: Validate Intel Homebrew lint on clean core checkout

on:
  push:
    branches: [intel-clean-lint]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      LOG_DIR: ${{ github.workspace }}/validation-logs
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare clean Homebrew core checkout
        timeout-minutes: 10
        run: |
          mkdir -p "$LOG_DIR"
          if brew list --formula azure-cli >/dev/null 2>&1; then
            brew uninstall --force --ignore-dependencies azure-cli
          fi
          brew update 2>&1 | tee "$LOG_DIR/update.log"
          brew tap --force homebrew/core
          core=$(brew --repository homebrew/core)
          # Discard preinstalled runner edits, including update/stash conflicts.
          # This is the disposable worker's tap, not the contributor's checkout.
          git -C "$core" status --short | tee "$LOG_DIR/runner-edits.log"
          git -C "$core" restore --source=HEAD --staged --worktree .
          cp Formula/toit.rb "$core/Formula/t/toit.rb"
          git -C "$core" add Formula/t/toit.rb
          git -C "$core" diff --cached --check
          git -C "$core" status --short | tee "$LOG_DIR/clean-status.log"
          shasum -a 256 Formula/toit.rb | tee "$LOG_DIR/formula-sha256.log"

      - name: Run final Homebrew checks on clean core
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          cd "$(brew --repository homebrew/core)"
          brew lgtm --online 2>&1 | tee "$LOG_DIR/lgtm.log"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: homebrew-intel-clean-lint
          path: validation-logs/
          retention-days: 7
